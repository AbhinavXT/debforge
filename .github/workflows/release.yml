name: Release

# Push a tag like v1.2.0 -> builds a signed release APK and publishes it as a
# GitHub Release. The app's update check reads these releases.
#
# Repository secrets needed (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64      base64 of your .jks file  (base64 -w0 release.jks)
#   KEYSTORE_PASSWORD    store password
#   KEY_ALIAS            key alias
#   KEY_PASSWORD         key password
#   TMDB_API_KEY         optional, bundled default for posters
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set - an unsigned APK cannot be installed. See README 'Releasing'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DEBFORGE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed release APK
        env:
          DEBFORGE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DEBFORGE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DEBFORGE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DEBFORGE_GITHUB_REPO: ${{ github.repository }}
        run: ./gradlew --stacktrace testReleaseUnitTest assembleRelease

      - name: Collect APK
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          test -n "$apk" || { echo "::error::no APK produced"; exit 1; }
          if [[ "$apk" == *unsigned* ]]; then
            echo "::error::APK is unsigned - check the keystore secrets"; exit 1
          fi
          out="DebForge-${TAG}.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "APK=$out" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --title "DebForge $TAG" --generate-notes \
              $([[ "$TAG" == *-* ]] && echo --prerelease)
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
