name: Release

# Push a tag like v1.2.0 -> builds the signed release APK and publishes it as a
# GitHub Release. The same APK is what F-Droid verifies against its own build
# and what Obtainium installs, so it must be reproducible (see README).
#
# Use scripts/release.sh to make the tag: it keeps versionName, versionCode,
# the changelog and the tag in step.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64      base64 of your .jks file
#   KEYSTORE_PASSWORD    store password
#   KEY_ALIAS            key alias
#   KEY_PASSWORD         key password
on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            tag:
                description: "Existing tag to (re)build, e.g. v1.2.0"
                required: true

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            TAG: ${{ github.event.inputs.tag || github.ref_name }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ env.TAG }}

            - name: Check tag matches the app version
              run: |
                  name=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
                  code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)
                  if [ "v$name" != "$TAG" ]; then
                    echo "::error::Tag $TAG does not match versionName $name in app/build.gradle.kts. Use scripts/release.sh."
                    exit 1
                  fi
                  echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
                  notes="fastlane/metadata/android/en-US/changelogs/$code.txt"
                  if [ -f "$notes" ]; then
                    echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"
                  else
                    echo "::warning::No changelog at $notes - F-Droid will show no \"What's new\"."
                  fi

            - name: Make gradlew executable
              run: chmod +x gradlew

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"

            - uses: gradle/actions/setup-gradle@v4

            - name: Restore signing keystore
              env:
                  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
              run: |
                  if [ -z "$KEYSTORE_BASE64" ]; then
                    echo "::error::KEYSTORE_BASE64 secret is not set - an unsigned APK cannot be installed. See README 'Releasing'."
                    exit 1
                  fi
                  echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
                  echo "DEBFORGE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

            # Deliberately no TMDB key or other env-dependent input: F-Droid builds
            # from the same tag without our secrets, and its APK must match ours.
            - name: Test and build signed release APK
              env:
                  DEBFORGE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  DEBFORGE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  DEBFORGE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: |
                  # AGP 9 only creates unit-test tasks for the tested build type (debug).
                  ./gradlew --stacktrace testDebugUnitTest assembleRelease
                  cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/first.apk"

            # Cheap guard against non-determinism (the kind that would make F-Droid
            # refuse our APK): a clean second build must be byte-identical.
            - name: Reproducibility check (clean rebuild)
              env:
                  DEBFORGE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  DEBFORGE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  DEBFORGE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: |
                  ./gradlew --no-build-cache clean assembleRelease
                  second=$(ls app/build/outputs/apk/release/*.apk | head -n1)
                  if cmp -s "$RUNNER_TEMP/first.apk" "$second"; then
                    echo "Rebuild is byte-identical."
                  else
                    echo "::error::Release APK differs between two clean builds, so F-Droid would reject it. Differing entries:"
                    python3 - "$RUNNER_TEMP/first.apk" "$second" <<'PY'
                  import sys, zipfile, hashlib
                  a, b = (zipfile.ZipFile(p) for p in sys.argv[1:3])
                  h = lambda z, n: hashlib.sha256(z.read(n)).hexdigest()
                  for n in sorted(set(a.namelist()) | set(b.namelist())):
                      if n not in a.namelist() or n not in b.namelist() or h(a, n) != h(b, n):
                          print("  ", n)
                  PY
                    exit 1
                  fi

            - name: Collect APK and signing certificate
              run: |
                  apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
                  if [[ "$apk" == *unsigned* ]]; then
                    echo "::error::APK is unsigned - check the keystore secrets"; exit 1
                  fi
                  out="DebForge-${TAG}.apk"
                  cp "$apk" "$out"
                  sha256sum "$out" > "$out.sha256"
                  echo "APK=$out" >> "$GITHUB_ENV"

                  apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner
                  "$apksigner" verify "$out"
                  cert=$("$apksigner" verify --print-certs "$out" | sed -nE 's/.*certificate SHA-256 digest: ([0-9a-f]+).*/\1/p' | head -n1)
                  {
                    echo "### $out"
                    echo "- versionCode: \`$VERSION_CODE\`"
                    echo "- APK SHA-256: \`$(cut -d' ' -f1 "$out.sha256")\`"
                    echo "- Signing certificate SHA-256 (F-Droid \`AllowedAPKSigningKeys\`): \`$cert\`"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh release view "$TAG" >/dev/null 2>&1; then
                    gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
                    exit 0
                  fi
                  notes_args=(--generate-notes)
                  [ -n "$NOTES_FILE" ] && notes_args=(--notes-file "$NOTES_FILE")
                  pre=()
                  [[ "$TAG" == *-* ]] && pre=(--prerelease)
                  gh release create "$TAG" "$APK" "$APK.sha256" --title "DebForge $TAG" "${notes_args[@]}" "${pre[@]}"

            - name: Remove keystore
              if: always()
              run: rm -f "$RUNNER_TEMP/release.jks"
