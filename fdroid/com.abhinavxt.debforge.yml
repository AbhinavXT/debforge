# Draft recipe for F-Droid. Submit it as metadata/com.abhinavxt.debforge.yml in
# a merge request to https://gitlab.com/fdroid/fdroiddata (see README
# "Publishing on F-Droid"). F-Droid reviewers may adjust it.
AntiFeatures:
  NonFreeNet:
    en-US: >-
      Needs an account with a proprietary debrid service (TorBox, Real-Debrid,
      AllDebrid, Premiumize or Debrid-Link). Posters come from TMDB if you add
      a key.
Categories:
  - Download
License: GPL-3.0-or-later
AuthorName: AbhinavXT
AuthorWebSite: https://github.com/AbhinavXT
SourceCode: https://github.com/AbhinavXT/debforge
IssueTracker: https://github.com/AbhinavXT/debforge/issues
Changelog: https://github.com/AbhinavXT/debforge/releases

AutoName: DebForge

RepoType: git
Repo: https://github.com/AbhinavXT/debforge.git
# Reproducible build: F-Droid builds the tag itself, compares the result with
# this APK, and publishes our developer-signed APK only if they match.
Binaries: https://github.com/AbhinavXT/debforge/releases/download/v%v/DebForge-v%v.apk

Builds:
  - versionName: 1.1.2
    versionCode: 10102
    commit: v1.1.2
    subdir: app
    gradle:
      - yes
    # Toolchain auto-download isn't allowed on the build server; JDK 21 is
    # already installed there. Removing the plugin doesn't change the APK.
    prebuild:
      - sed -i -e '/foojay/d' ../settings.gradle.kts

# From the "Signing certificate SHA-256" line in the GitHub release job
# summary (or: apksigner verify --print-certs DebForge-v1.1.2.apk).
AllowedAPKSigningKeys: REPLACE_WITH_SIGNING_CERT_SHA256

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 1.1.2
CurrentVersionCode: 10102
